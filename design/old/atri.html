<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ATRI-bot</title>
    <link href="https://fonts.googleapis.com/css?family=Righteous&display=swap" rel="stylesheet">
    
    <style>
    body {
        font-family: "Open Sans", sans-serif;
        font-weight: 300;
        background-image: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
        margin: 0;
        overflow: hidden;
    }
    ul { list-style: none; padding: 0; margin: 0 }
    li { list-style: none }
    .inline-block { display: inline-block }
    .act-table { display: table }
    .act-table-cell { display: table-cell }
    a, a:hover, a:focus, a:active { text-decoration: none; color: inherit }
    .text-center { text-align: center }
    .text-left { text-align: left }
    .text-right { text-align: right }
    .pull-right { float: right }
    .pull-left { float: left }
    .ver-middle { vertical-align: middle }
    .clearfix::after { content: ""; display: table; clear: both }
    
    /* 导航栏 */
    header {
        position: fixed;
        top: 20px;
        left: 0; right: 0;
        z-index: 1000;
        text-align: center;
        transition: top 0.5s;
    }
    header.go-out { top: -100px; }
    
    header nav ul {
        display: inline-block;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(5px);
        border-radius: 30px;
        padding: 5px 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    header nav ul li {
        display: inline-block;
        margin: 0 10px;
    }
    header nav ul li a {
        display: block;
        padding: 10px 20px;
        color: #fff;
        font-weight: 600;
        border-radius: 20px;
        transition: 0.3s;
    }
    header nav ul li.active a,
    header nav ul li:hover a {
        background: rgba(255, 255, 255, 0.4);
    }

    /* 3D 容器 */
    #wrap {
        position: fixed;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
        transition: .8s;
        -webkit-transition: .8s;
        -moz-transition: .8s
    }
    #wrap.active {
        top: 10%;
        bottom: 10%;
        right: 10%;
        left: 10%
    }




    /* 3D 变换逻辑 */
    .cube {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
        -webkit-transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
        -moz-transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
        transition: top 1s;
        -webkit-transition: 1s;
        -moz-transition: 1s
    }
    .cube.reverse-back {
        transform: rotateX(180deg) rotateY(0deg) rotateZ(-180deg);
        -webkit-transform: rotateX(180deg) rotateY(0deg) rotateZ(-180deg);
        -moz-transform: rotateX(180deg) rotateY(0deg) rotateZ(-180deg)
    }
    .cube.reverse-back .back {
        transform: translateZ(-800px) rotateY(-180deg);
        -webkit-transform: translateZ(-800px) rotateY(-180deg);
        -moz-transform: translateZ(-800px) rotateY(-180deg)
    }
    .cube.reverse-left .left {
        transform: translateX(-800px) rotateY(-90deg);
        -webkit-transform: translateX(-800px) rotateY(-90deg);
        -moz-transform: translateX(-800px) rotateY(-90deg)
    }
    .cube.reverse-right {
        transform: rotateX(0deg) rotateY(270deg) rotateZ(0deg);
        -webkit-transform: rotateX(0deg) rotateY(270deg) rotateZ(0deg);
        -moz-transform: rotateX(0deg) rotateY(270deg) rotateZ(0deg)
    }
    .cube.reverse-right .right {
        transform: translateX(800px) rotateY(90deg);
        -webkit-transform: translateX(800px) rotateY(90deg);
        -moz-transform: translateX(800px) rotateY(90deg)
    }
    .cube.reverse-top {
        transform: rotateX(-90deg) rotateY(0deg) rotateZ(0deg);
        -webkit-transform: rotateX(-90deg) rotateY(0deg) rotateZ(0deg);
        -moz-transform: rotateX(-90deg) rotateY(0deg) rotateZ(0deg)
    }
    .cube.reverse-top .top {
        transform: translateY(-400px) rotateX(90deg);
        -webkit-transform: translateY(-400px) rotateX(90deg);
        -moz-transform: translateY(-400px) rotateX(90deg)
    }
    .cube.reverse-bottom .bottom {
        transform: translateY(400px) rotateX(-90deg);
        -webkit-transform: translateY(400px) rotateX(-90deg);
        -moz-transform: translateY(400px) rotateX(-90deg)
    }


    .face {
        display: block;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: 100%;
        color: #666;
        font-size: 18px;
        text-align: center;
        box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.5);
        -webkit-box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.5);
        -moz-box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.5)
    }
    .front {
        background-image: linear-gradient(135deg, #CE9FFC 10%, #7367F0 100%);
    }
    .front.active {
        transform: translateZ(800px);
        -webkit-transform: translateZ(800px);
        -moz-transform: translateZ(800px)
    }
    .back {
        background-image: linear-gradient(135deg, #FEB692 10%, #EA5455 100%);
    }
    .back:not(.active) {
        transform: translateZ(-800px) rotateY(-180deg);
        -webkit-transform: translateZ(-800px) rotateY(-180deg);
        -moz-transform: translateZ(-800px) rotateY(-180deg)
    }
    .back.active {
        transform: translateZ(800px);
        -webkit-transform: translateZ(800px);
        -moz-transform: translateZ(800px)
    }
    .left:not(.active) {
        transform: translateX(-800px) rotateY(-90deg);
        -webkit-transform: translateX(-800px) rotateY(-90deg);
        -moz-transform: translateX(-800px) rotateY(-90deg)
    }
    .left.active {
        transform: translateZ(800px);
        -webkit-transform: translateZ(800px);
        -moz-transform: translateZ(800px)
    }
    .right {
        background-image: linear-gradient(135deg, #43CBFF 10%, #9708CC 100%);
    }
    .right:not(.active) {
        transform: translateX(800px) rotateY(90deg);
        -webkit-transform: translateX(800px) rotateY(90deg);
        -moz-transform: translateX(800px) rotateY(90deg)
    }
    .right.active {
        transform: translateZ(800px);
        -webkit-transform: translateZ(800px);
        -moz-transform: translateZ(800px)
    }
    .top {
        background-image: linear-gradient(135deg, #F761A1 10%, #8C1BAB 100%);
    }
    .top:not(.active) {
        transform: translateY(-400px) rotateX(90deg);
        -webkit-transform: translateY(-400px) rotateX(90deg);
        -moz-transform: translateY(-400px) rotateX(90deg)
    }
    .top.active {
        transform: translateZ(800px);
        -webkit-transform: translateZ(800px);
        -moz-transform: translateZ(800px)
    }
    .bottom:not(.active) {
        transform: translateY(400px) rotateX(-90deg);
        -webkit-transform: translateY(400px) rotateX(-90deg);
        -moz-transform: translateY(400px) rotateX(-90deg)
    }
    .bottom.active {
        transform: translateZ(800px);
        -webkit-transform: translateZ(800px);
        -moz-transform: translateZ(800px)
    }



    .home-container {
        display: flex;
        width: 100%;
        height: 100%;
        padding: 20px; 
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        gap: 40px;
    }

    .home-left {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding-right: 0;
        z-index: 10;
    }
        
    .home-right {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
    }


    .main-card {
        display: flex;
        width: 100%;
        max-width: 1100px; /* 限制最大宽度 */
        height: auto;
        min-height: 60vh;
        background: rgba(255, 255, 255, 0.15); /* 统一的半透明背景 */
        backdrop-filter: blur(12px); /* 统一的毛玻璃 */
        -webkit-backdrop-filter: blur(12px);
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        padding: 60px;
        gap: 50px; /* 左右内容的间距 */
        align-items: center;
        position: relative;
        overflow: hidden; /* 确保内容不溢出圆角 */
        transform: scale(1);
        opacity: 1;
        filter: blur(0px);
    }

    #wrap.active .main-card {
        transform: scale(0.85) translateZ(-50px); /* 缩小到 85% 并稍微后退 */
        opacity: 0.5;  /* 变半透明，让旋转过程不那么抢眼 */
        filter: blur(4px); /* 增加一点运动模糊感 */
    }


        /* 波浪容器 */
    .desc-wave-bg {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
        opacity: 0.6;
    }

    /* 波浪动画伪元素 */
    .desc-wave-bg::before, .desc-wave-bg::after {
        content: "";
        position: absolute;
        width: 600px; 
        height: 600px; 
        bottom: -450px; 
        left: 50%;
        background-color: rgba(255, 255, 255, 0.15);
        border-radius: 40%;
        transform: translateX(-50%) rotate(0);
        animation: rotate 10s linear infinite;
    }

    .desc-wave-bg::after {
        border-radius: 35%;
        background-color: rgba(255, 255, 255, 0.25); /* 浪尖颜色 */
        bottom: -460px;
        animation: rotate 15s linear -5s infinite;
    }


    /* 图片容器样式 */
    .img-card {
        background: transparent; /* 移除背景 */
        box-shadow: none; /* 移除阴影 */
        border: none;
        padding: 0;
        display: flex;
        justify-content: center;
    }
            
    .home-img {
        max-width: 100%;
        max-height: 60vh; /* 限制图片高度 */
        object-fit: contain;
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
        animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
        100% { transform: translateY(0px); }
    }

    /* 描述文本样式 */
    .home-description {
        max-width: 450px;
        position: relative;
        margin-top: 80px;
        color: #fff;
        background: rgba(100, 80, 180, 0.4); /* 深紫色半透明背景 */
        padding: 25px;
        border-radius: 15px;
        font-size: 16px;
        line-height: 1.8;
        max-width: 500px;
        backdrop-filter: blur(10px);
        border-left: 5px solid #fff;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        overflow: hidden;
    }
    /* .home-description h2 {
        margin-top: 0;
        font-weight: 700;
        margin-bottom: 10px;
        font-size: 24px;
        position: relative;
        z-index: 5;
    } */

    .home-description h2 {
        font-size: 32px;
        margin-bottom: 20px;
        color: #fff;
        font-weight: 700;
    }

    .home-description p {
        font-size: 16px;
        line-height: 1.8;
        background: rgba(0, 0, 0, 0.1); /* 给文字加一点点深色底衬托，提高可读性 */
        padding: 20px;
        border-radius: 15px;
        border-left: 4px solid rgba(255,255,255,0.5);
    }



    .atri-wrapper {
        display: flex;
        gap: 15px;
        margin-bottom: 30px; 
    }

    .letter-box {
        width: 120px;
        height: 120px;
        position: relative;
        border-radius: 15px;
        overflow: hidden; /* 关键：限制波浪在方块内 */
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        transition: transform 0.3s;
        cursor: pointer;
        flex-shrink: 0;
    }


    .heading-style {
        font-family: 'Righteous', cursive;
        font-size: 120px;
        font-weight: 400;
        margin: 0;
        line-height: 120px;
        text-align: center;
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 2; /* 层级 2，在波浪之上 */
        
        color: rgba(255, 255, 255, 0.15);
        -webkit-text-stroke: 4px #f83838;
        text-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }



    .letter-box:hover {
        transform: translateY(-10px);
    }

    .wave-container {
        position: relative;
        width: 100%;
        height: 100%;
    }

    /* 波浪层 - 位于文字下方 */
    .wave {
        position: absolute;
        width: 100%;
        height: 100%;
        bottom: 0;
        z-index: 1; /* 层级 1 */
    }


    /* 波浪动画伪元素 */
    .wave::before, .wave::after {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        bottom: 0;
        left: 50%;
        background-color: rgba(255, 255, 255, 0.3); /* 波浪颜色：半透明白 */
        border-radius: 40%;
        transform: translateX(-50%) rotate(0);
        animation: rotate 6s linear infinite;
        z-index: 10;
    }

    .wave::after {
        border-radius: 35%;
        background-color: rgba(255, 255, 255, 0.7); /* 浪尖颜色：更白的半透明 */
        animation: rotate 10s linear -5s infinite;
        z-index: 20;
    }

    @keyframes rotate {
        50% { transform: translateX(-50%) rotate(180deg); }
        100% { transform: translateX(-50%) rotate(360deg); }
    }

    @media (max-width: 1000px) {
        .main-card {
        flex-direction: column-reverse; /* 手机端图片在上面，文字在下面 */
        padding: 40px 20px;
        height: auto;
        gap: 30px;
        }
        .home-container { flex-direction: column; padding: 100px 20px 20px; overflow-y: auto; }
        .home-left { 
        width: 100%;
        align-items: center; 
        padding-right: 0; 
        margin-bottom: 40px; 
        text-align: center; 
        }
        .atri-wrapper {        
        justify-content: center;
        transform: scale(0.8);
        margin-bottom: 20px;
        }
        .home-description p {
        text-align: left;
        }
        .atri-title { font-size: 80px; }
        .home-img { max-height: 40vh; }
    }

    .bg-elements {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        overflow: hidden;
        z-index: 1; /* 在内容之下 */
        pointer-events: none;
    }

    /* 云朵 */
    .cloud {
        position: absolute;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 50px;
        animation: drift linear infinite;
        filter: blur(8px);
    }
    .cloud::after, .cloud::before {
        content: '';
        position: absolute;
        background: inherit;
        border-radius: 50%;
    }
    .cloud::after { width: 50px; height: 50px; top: -25px; left: 25px; }
    .cloud::before { width: 40px; height: 40px; top: -15px; left: 10px; }
    
    /* 云朵漂浮动画 */
    @keyframes drift {
        from { transform: translateX(-150px); }
        to { transform: translateX(120vw); }
    }

    .home-container {
        position: relative;
        z-index: 10; /* 确保内容在云朵之上 */
    }

    .loader-wrap {
        position: fixed; z-index: 9999; height: 100vh; width: 100%; left: 0; top: 0;
        display: flex; align-items: center; justify-content: center; background: transparent; pointer-events: none;
    }
    .loader-wrap svg { position: absolute; top: 0; width: 100vw; height: 110vh; fill: #000; }
    .loader-wrap .loader-wrap-heading .load-text { font-size: 20px; font-weight: 200; letter-spacing: 15px; text-transform: uppercase; color: #fff; position: relative; z-index: 10000; }
    .load-text span { animation: loading 1s infinite alternate; }
    .load-text span:nth-child(1) { animation-delay: 0s; }
    .load-text span:nth-child(2) { animation-delay: 0.1s; }
    .load-text span:nth-child(3) { animation-delay: 0.2s; }
    .load-text span:nth-child(4) { animation-delay: 0.3s; }
    .load-text span:nth-child(5) { animation-delay: 0.4s; }
    .load-text span:nth-child(6) { animation-delay: 0.5s; }
    .load-text span:nth-child(7) { animation-delay: 0.6s; }
    @keyframes loading { 0% { opacity: 1; } 100% { opacity: 0; } }


    #portfolio {
        display: flex !important; 
        justify-content: center; 
        align-items: center;     
        width: 100%;
        height: 100%;
    }

    .shell {
        position: relative;
        width: 60vw;
        height: 40vw;
        max-width: 640px;
        max-height: 360px;
        margin: 0;
        color: white;
        perspective: 1000px;
        transform-origin: center;

        margin: 0 !important;
    }

    .content {
        display: flex;
        justify-content: center;
        align-items: center;
        position: absolute;
        width: 100%;
        height: 100%;
        transform-origin: center;
        transform-style: preserve-3d;
        transform: translateZ(-30vw) rotateY(0);
        animation: carousel 10s infinite cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }

    .item {
        position: absolute;
        width: 60vw;
        height: 40vw;
        max-width: 640px;
        max-height: 360px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        border-radius: 6px;
        background-size: cover;
        -webkit-box-reflect: below 25px -webkit-linear-gradient(transparent 50%, rgba(255, 255, 255, 0.3));
    }

    .item:nth-child(1) {
        background-image: url(https://pic1.imgdb.cn/item/697cf0701af8234bd07d86e8.png);
        transform: rotateY(0) translateZ(35vw);
    }

    .item:nth-child(2) {
        background-image: url(https://pic1.imgdb.cn/item/697cef9d1af8234bd07d86c9.png);
        transform: rotateY(120deg) translateZ(35vw);
    }

    .item:nth-child(3) {
        background-image: url(https://pic1.imgdb.cn/item/697cf0201af8234bd07d86dd.png);
        transform: rotateY(240deg) translateZ(35vw);
    }

    @keyframes carousel {
        0%,
        17.5% {
            transform: translateZ(-35vw) rotateY(0);
        }
        27.5%,
        45% {
            transform: translateZ(-35vw) rotateY(-120deg);
        }
        55%,
        72.5% {
            transform: translateZ(-35vw) rotateY(-240deg);
        }
        82.5%,
        100% {
            transform: translateZ(-35vw) rotateY(-360deg);
        }
    }


    </style>
</head>

        <div class="home-container">
        
        <div class="main-card">

            <div class="home-left">

                <div class="atri-wrapper">

            <div class="home-description">
                <div class="desc-wave-bg"></div>
                <div class="desc-content">
                <h2>关于ATRI-bot</h2>
                <p>
                    ATRI-bot 是一个用python编写的qq机器人项目。专注于群的LLM聊天,已经支持了MCP和RAG知识库,目前已经被群友调戏了一年多了,已经好评如潮了(大概).

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
<script>
(function(document, window, $){
    // Loader Animation
    $(window).on('load', function() {
    const svg = document.getElementById("svg");
    const tl = gsap.timeline();
    const curve = "M0 502S175 272 500 272s500 230 500 230V0H0Z";
    const flat = "M0 2S175 1 500 1s500 1 500 1V0H0Z";

    //动画
    tl.to(".loader-wrap-heading .load-text", {
        delay: 0.5,
        y: -100,
        opacity: 0,
    }).to(svg, {
        duration: 0.5,
        attr: { d: curve },
        ease: "power2.easeIn",
    }).to(svg, {
        duration: 0.5,
        attr: { d: flat },
        ease: "power2.easeOut",
    }).to(".loader-wrap", {
        y: -1500,
        duration: 0.8,
    }).to(".loader-wrap", {
        zIndex: -1,
        display: "none",
    })
    .from("header", {
        y: -100,
        opacity: 0,
        duration: 0.8,
        clearProps: "all"
    }, "-=0.5")
    .from(".main-card", {
        y: 100,           
        scale: 0.95,      
        opacity: 0,       
        duration: 1,      
        ease: "power3.out"
        }, "-=0.6")         
        
        //字母方块跳出
    .from(".letter-box", {
        y: 50,
        opacity: 0,
        scale: 1,
        duration: 0.8,
        stagger: 0.25,     // 依次跳出
        ease: "back.out(1.7)"
    }, "-=0.8")
    
    //描述文字浮现
    .from(".home-description", {
        y: 20,
        opacity: 0,
        duration: 1,
        ease: "power2.out"
    }, "-=0.2")
                    
    .from(".img-card", {
        x: 50,           
        opacity: 0,
        duration: 1,
        ease: "power3.out"
    }, "-=0.1");       
    });
    


    // 3D Nav
    $(document).ready(function(){
    var windowWidth = $(window).width(),
        windowHeight = $(window).height(),
        $header = $('header');

    function headerAnchors(){
        var pageDirection = '';
        var thisElement;
        var timeout;
        $header.find('nav li a').click(function(event){
        event.preventDefault();
        $('.cube').removeClass('reverse-' + pageDirection);
        thisElement = $(this);
        pageDirection = thisElement.data('direction');
        thisElement.parent().addClass('active').siblings().removeClass('active');
        $('.cube').addClass('reverse-' + pageDirection);
        $header.addClass('go-out');
        $('#wrap').addClass('active');
        clearTimeout(timeout);
        timeout = setTimeout(function(){
            $header.removeClass('go-out');
            $('#wrap').removeClass('active');
        }, 1000);
        });
    }
    headerAnchors();

    $(window).resize(function(){
        windowWidth = $(window).width();
        windowHeight = $(window).height();
    });
    });
})(document, window, jQuery);
</script>
