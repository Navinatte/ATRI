<main id="main" class="works">

  <section class="works-hero">
    <div class="wrap">
      <p class="works-hero__k" data-reveal>WORKS / 作品</p>
      <h1 class="works-hero__title" data-reveal data-delay="1">作品集</h1>
    </div>
  </section>

  <section class="works-gallery">
    <div class="wrap">
      <div class="gallery" id="gallery">
        <div class="gallery__track" id="galleryTrack" tabindex="0" role="group"
             aria-label="作品插画，共 3 张">

          <figure class="gallery__item">
            <div class="gallery__frame">
              <img class="gallery__img" src="assets/img/ATRI-bot-work-01.webp"
                   width="1440" height="810" decoding="async"
                   alt="深夜色调的亚托莉插画：红色眼瞳在暗部里发亮，画面右上角是一轮带红晕的月。">
            </div>
            <figcaption class="gallery__cap">
              <span class="gallery__no" aria-hidden="true">01</span>
            </figcaption>
          </figure>

          <figure class="gallery__item">
            <div class="gallery__frame">
              <img class="gallery__img" src="assets/img/ATRI-bot-work-02.webp"
                   width="1440" height="810" loading="lazy" decoding="async"
                   alt="明亮色调的亚托莉插画：侧脸与扬起的头发，身后铺满白色的蟹形纹样。">
            </div>
            <figcaption class="gallery__cap">
              <span class="gallery__no" aria-hidden="true">02</span>
            </figcaption>
          </figure>

          <figure class="gallery__item">
            <div class="gallery__frame">
              <img class="gallery__img" src="assets/img/ATRI-bot-work-03.webp"
                   width="1440" height="810" loading="lazy" decoding="async"
                   alt="仿系统故障蓝屏的亚托莉插画：画面左侧是她的脸，右侧是故障提示文字与一个二维码。">
            </div>
            <figcaption class="gallery__cap">
              <span class="gallery__no" aria-hidden="true">03</span>
            </figcaption>
          </figure>

        </div>

        <div class="gallery__bar">
          <button class="gallery__btn" id="galleryPrev" type="button"
                  aria-label="上一张" aria-controls="galleryTrack">
            <svg class="gallery__ico gallery__ico--flip" viewBox="0 0 14 14" aria-hidden="true">
              <path d="M2 7h10M8 3l4 4-4 4"/>
            </svg>
          </button>
          <p class="gallery__count" aria-live="polite"><b id="galleryNow">01</b> / 03</p>
          <button class="gallery__btn" id="galleryNext" type="button"
                  aria-label="下一张" aria-controls="galleryTrack">
            <svg class="gallery__ico" viewBox="0 0 14 14" aria-hidden="true">
              <path d="M2 7h10M8 3l4 4-4 4"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <section class="works-reward" id="reward" hidden aria-labelledby="rewardTitle">
    <div class="wrap">
      <h2 class="works-h2" id="rewardTitle">小游戏配乐</h2>

      <div class="reward">
        <button class="reward__play" id="rewardPlay" type="button">
          <svg class="reward__ico reward__ico--play" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M5.6 3.1v9.8L13.2 8z"/>
          </svg>
          <svg class="reward__ico reward__ico--pause" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M5.1 3.1h2v9.8h-2zM8.9 3.1h2v9.8h-2z"/>
          </svg>
          <span class="reward__label">播放</span>
        </button>

        <div class="reward__meta">
          <p class="reward__title">宝箱の毎日</p>
          <p class="reward__sub">4:01</p>
        </div>

        <a class="btn btn--sm"
           href="assets/audios/%E5%AE%9D%E7%AE%B1%E3%81%AE%E6%AF%8E%E6%97%A5.mp3"
           download="宝箱の毎日.mp3">
          <span>下载</span>
          <svg class="btn__ico" viewBox="0 0 14 14" aria-hidden="true">
            <path d="M7 2v8M3.5 6.5L7 10l3.5-3.5M2.5 12h9"/>
          </svg>
        </a>

        <div class="reward__progress">
          <div class="reward__bar">
            <div class="reward__track" aria-hidden="true"></div>
            <input class="reward__seek" id="rewardSeek" type="range"
                   min="0" max="100" step="1" value="0"
                   aria-label="播放进度" disabled>
          </div>
        </div>
      </div>

      <audio id="rewardAudio" preload="none"
             src="assets/audios/%E5%AE%9D%E7%AE%B1%E3%81%AE%E6%AF%8E%E6%97%A5.mp3"></audio>
    </div>
  </section>
